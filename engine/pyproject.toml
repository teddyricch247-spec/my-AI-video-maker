[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbeat-sprite"
version = "0.1.0"
description = "Deterministic engine: canvas-2D beat scenes, visual checks, silent video (needs Playwright, Chromium, ffmpeg: render machine only)."
requires-python = ">=3.11"
dependencies = ["vbeat-shared"]

[project.optional-dependencies]
sprite = ["playwright"]
test = ["pytest", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "../shared/src"]
