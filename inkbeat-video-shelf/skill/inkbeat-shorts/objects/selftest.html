<script type="module">
import * as THREE from 'three';
import { makeCharacter, CAST, EXPRESSIONS } from './character.js';
import { makeShovel } from './shovel.js';
import { makeCar, crashPath } from './car.js';
import { makeTree } from './tree.js';
const out = { checks: [], fails: 0 };
const ok = (name, pass, info = '') => { out.checks.push({ name, pass, info }); if (!pass) out.fails++; };
const wp = (o) => o.getWorldPosition(new THREE.Vector3());
const snap = (c) => { c.group.updateMatrixWorld(true); const a = []; for (const k of Object.keys(c.parts)) { const p = wp(c.parts[k]); a.push(p.x, p.y, p.z); } return a; };
const finite = (a) => a.every(Number.isFinite);
const ACTS = ['idle', 'walk', 'run', 'wave', 'point', 'talk', 'react', 'sit', 'plant', 'hold', 'dig'];
for (const who of ['sam', 'ada']) {
  const c = makeCharacter(CAST[who]);
  const sv = makeShovel(); c.group.add(sv.group); c.carry(sv.group, sv.grips.A, sv.grips.B);
  for (const a of ACTS) {
    let bad = 0, impure = 0, minFoot = 9;
    for (let t = 0; t < 4; t += 0.173) {
      c.act({ [a]: 1 }, t); const s1 = snap(c); if (!finite(s1)) bad++;
      for (const S of ['L', 'R']) minFoot = Math.min(minFoot, wp(c.parts['foot' + S]).y);
      c.act({ [a]: 1 }, 9.9); c.act({ [a]: 1 }, t); const s2 = snap(c); if (s1.some((v, i) => Math.abs(v - s2[i]) > 1e-6)) impure++;
    }
    ok(`${who}.${a}: all joints finite`, bad === 0); ok(`${who}.${a}: pure function of t (same t -> same pose)`, impure === 0);
    ok(`${who}.${a}: feet never sink below ground (min ankle y ${minFoot.toFixed(3)} m)`, minFoot > 0.0);
  }
  // blends
  for (const w of [{ walk: 1, wave: 0.7 }, { run: 0.6, talk: 0.5 }, { sit: 1, talk: 1, wave: 1 }]) { c.act(w, 1.3); ok(`${who}: blend ${JSON.stringify(w)} finite`, finite(snap(c))); }
  // expressions + talk
  for (const e of EXPRESSIONS) { c.expression(e); c.talk(() => 0.8); c.act({ idle: 1 }, 0.5); c.talk(null); }
  ok(`${who}: all ${EXPRESSIONS.length} expressions draw`, true);
  // walk: planted stance foot must not slide. Group moves at speed v; the stance foot's WORLD z must stay constant during ground contact.
  for (const kind of ['walk', 'run']) {
    const v = c.speed(kind, 1); let worst = 0, contacts = 0;
    const prev = {};
    for (let t = 0; t < 3; t += 1 / 60) {
      c.group.position.set(0, 0, v * t); c.act({ [kind]: 1 }, t);
      for (const S of ['L', 'R']) { const f = wp(c.parts['foot' + S]); const low = f.y < c.dims.ankleY + 0.012;
        if (low && prev[S] !== undefined) { worst = Math.max(worst, Math.abs(f.z - prev[S].z) / (v / 60) ); contacts++; } prev[S] = low ? { z: f.z } : undefined; }
    }
    c.group.position.set(0, 0, 0);
    // |dz| per frame relative to the ground travel per frame: 0 = planted. Foot rolls (heel->toe) so allow some.
    ok(`${who}.${kind}: stance foot slide ratio ${worst.toFixed(2)} (0 = planted; < 0.45 OK) over ${contacts} contact frames`, worst < 0.45);
  }
  // IK reach: palm reaches a world target
  c.act({ idle: 1 }, 0); c.reach('R', [-0.3, 1.15, 0.28]); c.act({ idle: 1 }, 0); c.group.updateMatrixWorld(true);
  const hp = wp(c.parts.palmR), d = hp.distanceTo(new THREE.Vector3(-0.3, 1.15, 0.28)); c.reach('R', null);
  ok(`${who}: reach() lands the PALM within 5 cm (err ${(d * 100).toFixed(1)} cm)`, d < 0.05);
  // height
  sv.group.removeFromParent(); c.act({ idle: 1 }, 0); const box = new THREE.Box3().setFromObject(c.group); ok(`${who}: standing height ${box.max.y.toFixed(2)} m (hair incl.), feet at ${box.min.y.toFixed(3)} m`, box.max.y > 1.5 && box.max.y < 2.0 && Math.abs(box.min.y) < 0.03);
  // no Math.random in source is checked by the node wrapper
}

{ // car + tree: finite, pure (same t -> same pose), crash path ends at the trunk
  const cp = crashPath({ target: [-4.7, -8.4], hit: 3, lane: 1.7 }), car = makeCar({ color: 'blue' }).path(cp.path).crash(3), tree = makeTree().grow((t) => 0.5 + 0.1 * t).hits([3], cp.dir);
  let bad = 0, impure = 0;
  for (let t = 0; t < 8; t += 0.137) {
    car.update(t); tree.update(t); const a = [car.group, tree.group, ...car.parts.wheels, car.parts.hood].map((o) => { o.updateMatrixWorld(true); return o.matrixWorld.elements.slice(); }).flat(); if (!finite(a)) bad++;
    car.update(9.9); tree.update(9.9); car.update(t); tree.update(t); const b = [car.group, tree.group, ...car.parts.wheels, car.parts.hood].map((o) => { o.updateMatrixWorld(true); return o.matrixWorld.elements.slice(); }).flat(); if (a.some((v, i) => Math.abs(v - b[i]) > 1e-6)) impure++;
  }
  ok('car/tree finite', bad === 0, bad + ' bad'); ok('car/tree pure function of t', impure === 0, impure + ' impure');
  const p = cp.path(3); ok('crashPath front reaches trunk', Math.hypot(p.x + 2.1 * cp.dir[0] - (-4.7), p.z + 2.1 * cp.dir[1] - (-8.4)) < 0.3, JSON.stringify(p));
}
window.RESULT = out;
</script>
