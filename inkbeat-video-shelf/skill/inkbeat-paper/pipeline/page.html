<!doctype html><body style="margin:0"><canvas id=c></canvas><canvas id=o></canvas>
<script type="module">
import { PAPER } from '../assets/core/palette.js';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 720, H = +q.get('h') || 1280, FPS = +q.get('fps') || 30, SUB = +q.get('sub') || 1;
const LAND = W > H;
const CAPS = q.get('caps') || (LAND ? 'sentence' : 'word');
const CAPSCALE = +q.get('capscale') || 1, ACCENT = q.get('accent') || '#ffd23f', INKCOL = '#221E1A';

const cv = document.getElementById('c'), oc = document.getElementById('o');
cv.width = W; cv.height = H;
oc.width = W; oc.height = H;
const g = cv.getContext('2d');
const o = oc.getContext('2d');

await new FontFace('Poppins', 'url(./fonts/Poppins-ExtraBold.ttf)', { weight: '800' })
  .load()
  .then((f) => document.fonts.add(f));

const ctx = { w: W, h: H, fps: FPS, landscape: LAND, aspect: LAND ? '16:9' : '9:16', stageW: 1280, stageH: 720 };
const mod = await import('./scenes/' + q.get('scene') + '.js');
const S = typeof mod.build === 'function' ? mod.build(ctx) : mod;

function sentencesFromChunks(pairs) {
  const out = [];
  let cur = [];
  const flush = () => {
    if (cur.length) {
      out.push({ t: cur[0][0], end: cur[cur.length - 1][1], words: cur });
      cur = [];
    }
  };
  pairs.forEach(([t, txt], i) => {
    const toks = String(txt).split(/\s+/).filter(Boolean);
    const next = i + 1 < pairs.length ? pairs[i + 1][0] : t + 0.6;
    const span = Math.min(1.2, Math.max(0.2, next - t));
    toks.forEach((w, k) => {
      const s = t + (span * k) / toks.length;
      cur.push([s, s + (span / toks.length) * 0.9, w]);
      if (/[.!?…]["'”’)]*$/.test(w)) flush();
    });
    if (cur.length && next - t > 1.2) flush();
  });
  flush();
  return out;
}

let wordCaps = [], sentCaps = [];
{
  const raw = q.get('words') ? await (await fetch('/words.json')).json() : (mod.words || S.words || []);
  if (Array.isArray(raw)) {
    wordCaps = raw;
    sentCaps = sentencesFromChunks(raw);
  } else {
    wordCaps = raw.word || [];
    sentCaps = raw.sentence || [];
  }
}

const FONT = (px) => `800 ${px}px Poppins`;

function drawWord(t) {
  let cur = null;
  for (const [wt, txt] of wordCaps) if (t >= wt - 2 / FPS) cur = txt;
  if (!cur) return;
  const px = Math.round((LAND ? 0.060 * H : 86 * W / 1080) * CAPSCALE);
  const y = H * (LAND ? 0.8 : 0.7);
  o.font = FONT(px);
  o.textAlign = 'center';
  o.textBaseline = 'middle';
  o.lineJoin = 'round';
  o.lineWidth = px * 0.21;
  o.strokeStyle = INKCOL;
  o.strokeText(cur, W / 2, y);
  o.fillStyle = '#fff';
  o.fillText(cur, W / 2, y);
}

function wrapLines(words, px, maxW) {
  o.font = FONT(px);
  const sp = o.measureText(' ').width;
  const lines = [];
  let cur = [], w = 0;
  words.forEach((wd, i) => {
    const ww = o.measureText(wd[2]).width;
    if (cur.length && w + sp + ww > maxW) {
      lines.push(cur);
      cur = [];
      w = 0;
    }
    cur.push({ i, txt: wd[2], w: ww });
    w += (cur.length > 1 ? sp : 0) + ww;
  });
  if (cur.length) lines.push(cur);
  return { lines, sp };
}

function drawSentence(t) {
  const lead = 2 / FPS;
  let cur = null;
  for (const s of sentCaps) {
    if (t >= s.t - lead) cur = s;
    else break;
  }
  if (!cur || t > cur.end + 0.4) return;
  let px = Math.round(0.046 * H * CAPSCALE);
  const maxW = W * 0.8;
  let L = wrapLines(cur.words, px, maxW);
  for (let k = 0; k < 3 && L.lines.length > 2; k++) {
    px = Math.round(px * 0.93);
    L = wrapLines(cur.words, px, maxW);
  }
  let act = -1;
  cur.words.forEach((wd, i) => { if (t >= wd[0] - lead) act = i; });
  if (act >= 0) {
    const wd = cur.words[act], nx = cur.words[act + 1];
    if (t > wd[1] + 0.25 && (!nx || nx[0] - wd[1] > 0.5)) act = -1;
  }
  o.font = FONT(px);
  o.textAlign = 'left';
  o.textBaseline = 'alphabetic';
  o.lineJoin = 'round';
  o.lineWidth = px * 0.2;
  o.strokeStyle = INKCOL;
  const lh = px * 1.22, bottom = H * 0.915, y0 = bottom - (L.lines.length - 1) * lh;
  L.lines.forEach((ln, li) => {
    const total = ln.reduce((a, w) => a + w.w, 0) + L.sp * (ln.length - 1);
    let x = W / 2 - total / 2;
    const y = y0 + li * lh;
    const pos = ln.map((w) => { const p = x; x += w.w + L.sp; return p; });
    ln.forEach((w, k) => o.strokeText(w.txt, pos[k], y));
    ln.forEach((w, k) => { o.fillStyle = w.i === act ? ACCENT : '#fff'; o.fillText(w.txt, pos[k], y); });
  });
}

window.READY = true;
window.getMarkers = () => (typeof S.markers === 'function' ? S.markers() : []);
window.renderFrame = (f) => {
  for (let s = 0; s < SUB; s++) {
    const t = (f + (SUB > 1 ? (s / (SUB - 1) - 0.5) * 0.5 : 0)) / FPS;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = PAPER;
    g.fillRect(0, 0, W, H);
    g.save();
    if (typeof S.update === 'function') S.update(g, t);
    else if (typeof S.draw === 'function') S.draw(g, t);
    g.restore();
    o.globalAlpha = 1 / (s + 1);
    o.drawImage(cv, 0, 0);
  }
  o.globalAlpha = 1;
  const tc = f / FPS;
  if (CAPS === 'sentence') drawSentence(tc);
  else if (CAPS === 'word') drawWord(tc);
  return oc.toDataURL('image/jpeg', 0.95);
};
</script>
